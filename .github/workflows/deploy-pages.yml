name: Deploy Portale Web (GitHub Pages)

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Genera Indice Ricercabile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leggero (senza scaricare i 2.3 GB di LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 15

      - name: Scarica via LFS solo le 2 mappe dei plessi (~1.1 MB)
        run: |
          git lfs install
          git lfs pull --include="info-generali/Mappa*"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa poppler-utils per estrazione PDF calendario
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Sincronizza Calendario Esami Triennale da DIETI
        run: |
          python3 info-generali/web/sync_exam_calendar.py || echo "Avviso: sincronizzazione DIETI fallita, uso il fallback exam_calendar.json."

      - name: Salva aggiornamento calendario nel repository (se cambiato)
        run: |
          if ! git diff --quiet info-generali/web/exam_calendar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add info-generali/web/exam_calendar.json
            git commit -m "chore(calendar): aggiornamento automatico calendario esami DIETI [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Build statica Portale Web
        run: python3 info-generali/web/build_site.py --out _site

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
