name: Deploy Portale Web (GitHub Pages)

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  sync-calendar:
    name: Sincronizza Calendario DIETI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout leggero (0 MB LFS)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa poppler-utils per estrazione PDF calendario
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Sincronizza Calendario Esami Triennale da DIETI
        run: |
          python3 info-generali/web/sync_exam_calendar.py || echo "Avviso: sincronizzazione DIETI fallita, uso il fallback exam_calendar.json."

      - name: Salva aggiornamento calendario nel repository (se cambiato)
        run: |
          if ! git diff --quiet info-generali/web/exam_calendar.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add info-generali/web/exam_calendar.json
            git commit -m "chore(calendar): aggiornamento automatico calendario esami DIETI [skip ci]"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Aggiorna snapshot stato sito DIETI su status-data
        run: |
          if python3 info-generali/web/check_dieti_status.py \
            --out /tmp/dieti_status.json \
            --prev-url "https://raw.githubusercontent.com/${{ github.repository }}/status-data/dieti_status.json"; then
            WORK_DIR="/tmp/status-branch"
            rm -rf "$WORK_DIR"
            mkdir -p "$WORK_DIR"
            cp /tmp/dieti_status.json "$WORK_DIR/dieti_status.json"
            cd "$WORK_DIR"
            git init -b status-data
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dieti_status.json
            git commit -m "chore(status): aggiorna stato sito DIETI [skip ci]"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push --force origin status-data || echo "Avviso: push su status-data non riuscito."
          else
            echo "Avviso: controllo stato DIETI non riuscito in sync-calendar."
          fi

  build:
    name: Genera Indice Ricercabile
    needs: sync-calendar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout cronologia completa (0 MB LFS)
        uses: actions/checkout@v4
        with:
          ref: master
          lfs: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla stato sito DIETI (snapshot fallback)
        run: |
          python3 info-generali/web/check_dieti_status.py \
            --out /tmp/dieti_status.json \
            --prev-url "https://raw.githubusercontent.com/${{ github.repository }}/status-data/dieti_status.json" \
            || echo "Avviso: controllo stato DIETI non riuscito in fase di build."

      - name: Build statica Portale Web
        run: python3 info-generali/web/build_site.py --out _site --status-file /tmp/dieti_status.json

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pubblica su GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
