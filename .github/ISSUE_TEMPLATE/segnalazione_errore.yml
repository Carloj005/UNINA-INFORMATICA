name: "🐛 Segnala un Bug o un Errore"
description: "Segnala un bug del portale web, un problema su una funzionalità della repository o un errore nel materiale didattico."
title: "[Bug/Fix] "
labels: ["bug"]
body:
  - type: dropdown
    id: ambito
    attributes:
      label: Ambito della segnalazione
      description: "Indica a cosa si riferisce il problema riscontrato."
      options:
        - "Portale Web (interfaccia, ricerca, filtri, navigazione)"
        - "Funzionalità / Struttura della repository / Automazione"
        - "Errore o refuso in un file / appunto didattico"
        - "Altro"
    validations:
      required: true
  - type: input
    id: riferimento
    attributes:
      label: Sezione, Funzionalità o File interessato (opzionale)
      description: "Se applicabile, indica la sezione del sito, la funzionalità o il file specifico."
      placeholder: "Es. Filtro categorie sul portale web, oppure Geometria / appunti lezione 2"
    validations:
      required: false
  - type: textarea
    id: descrizione
    attributes:
      label: Descrizione del problema e comportamento atteso
      description: "Descrivi chiaramente il bug o l'errore riscontrato (puoi anche incollare uno screenshot) e come dovrebbe comportarsi."
      placeholder: "Spiega cosa succede, i passaggi per riprodurlo o la correzione suggerita..."
    validations:
      required: true
