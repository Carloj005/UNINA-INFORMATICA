name: "🚀 Segnala Traccia Progetto APSD"
description: "Invia la specifica o il template di un progetto di Analisi e Progettazione di Strutture Dati"
title: "[Progetto APSD] "
labels: ["contenuto"]
body:
  - type: input
    id: sessione
    attributes:
      label: Sessione / Data di Riferimento
      description: "Indica il mese/anno o la sessione di riferimento della traccia."
      placeholder: "Es. Ottobre 2026 (A.A. 2026/2027), Sessione Estiva 2026, ecc."
    validations:
      required: true
  - type: input
    id: canale
    attributes:
      label: Canale / Docente
      description: "Indica il docente o il canale di riferimento del corso di APSD."
      placeholder: "Es. Prof. Massimo Benerecetti"
    validations:
      required: true
  - type: textarea
    id: traccia
    attributes:
      label: Testo o Allegato della Traccia
      description: "Trascina qui il file PDF della specifica e/o l'archivio `.zip` del template, oppure descrivi le strutture dati richieste."
      placeholder: "Allega i file (Exercise.pdf, Template.zip, Diagrams.pdf) o incolla qui i dettagli della specifica..."
    validations:
      required: true
  - type: textarea
    id: variazioni_note
    attributes:
      label: Variazioni e Note
      description: "Eventuali chiarimenti del docente, gerarchia delle interfacce, scadenze o note sui test `zapsdtest`."
      placeholder: "Indica eventuali differenze rispetto agli anni precedenti, scadenze di consegna o note sui simpletest/fulltest..."
    validations:
      required: false
